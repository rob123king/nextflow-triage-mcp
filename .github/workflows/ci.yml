name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Three OSes because this server has no POSIX-only dependency and that is a
    # property worth defending: the moment something is added that breaks
    # Windows, CI says so rather than a user discovering it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install the pinned environment
        # --locked fails rather than silently re-resolving, so CI tests the same
        # dependency graph the lockfile describes.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest
